<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>介壽國中13班網站</title>
    <link rel="stylesheet" href="static/css/style.css" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  </head>
  <body class="public-page">
    <main class="public-shell">
      <section class="class-topbar" data-liquid-glass>
        <div>
          <span class="section-kicker">CS13 Class Site</span>
          <h1 class="section-title">介壽國中13班網站</h1>
        </div>
        <nav class="topbar-actions" aria-label="Public shortcuts">
          <a class="btn btn-secondary" href="#quote-section" id="tab-quote"
            >幹話</a
          >
          <a class="btn btn-secondary" href="#albums-section" id="tab-albums"
            >相簿</a
          >
          <a class="btn btn-secondary" href="#polls-section" id="tab-polls"
            >投票</a
          >
          <a class="btn btn-secondary" href="#login-section" id="tab-login"
            >登入</a
          >
          <a class="btn hidden" href="/static/app.html" id="tab-app">後台</a>
        </nav>
      </section>

      <section
        class="class-topbar quote-panel"
        id="quote-section"
        data-liquid-glass
      >
        <div class="quote-panel-main">
          <span class="section-kicker">Horse Quotes</span>
          <h2 class="section-title">簡幸貞幹話牆</h2>
          <div class="quote-text" id="quote-display">Loading...</div>
        </div>
        <div class="quote-panel-actions">
          <div class="quote-btn-group">
            <button class="btn btn-secondary" id="copy-quote-btn">複製</button>
            <button class="btn" id="next-quote-btn">換一句</button>
          </div>
          <form class="inline-form" id="public-quote-form">
            <input
              class="form-input"
              type="text"
              id="public-quote-input"
              placeholder="新增一句簡幸貞幹話吧，不用登入也可以👍"
              maxlength="120"
              required
            />
            <button class="btn" type="submit">新增</button>
          </form>
        </div>
      </section>

      <section
        class="section-panel hidden"
        id="albums-section"
        data-liquid-glass
      >
        <div class="section-heading-row">
          <div>
            <span class="section-kicker">Albums</span>
            <h2 class="section-title">班級相簿</h2>
            <p class="section-copy">
              不需登入就能看照片🥵登入後可以新增相簿和上傳照片
            </p>
          </div>
          <a
            class="btn btn-secondary auth-only-link hidden"
            href="/static/app.html#albums"
            >新增相簿</a
          >
        </div>
        <div class="album-grid" id="public-album-list">
          <div class="empty-state">相簿載入中...</div>
        </div>
      </section>

      <section
        class="section-panel hidden"
        id="polls-section"
        data-liquid-glass
      >
        <div class="section-heading-row">
          <div>
            <span class="section-kicker">Polls</span>
            <h2 class="section-title">班級投票</h2>
            <p class="section-copy">
              公開觀看結果，登入後才能投票或建立新投票 😀
            </p>
          </div>
          <a
            class="btn btn-secondary auth-only-link hidden"
            href="/static/app.html#polls"
            >建立投票</a
          >
        </div>
        <div class="poll-list" id="public-poll-list">
          <div class="empty-state">投票載入中...</div>
        </div>
      </section>

      <section
        class="class-topbar login-section hidden"
        id="login-section"
        data-liquid-glass
      >
        <div>
          <span class="section-kicker">Class Lounge</span>
          <h2 class="section-title">登入</h2>
          <p class="section-copy">
            登入後可以聊天、建立相簿、上傳照片、建立投票😲
          </p>
        </div>
        <form class="login-form-inline" id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-username">Username</label>
            <input
              class="form-input"
              type="text"
              id="login-username"
              required
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input
              class="form-input"
              type="password"
              id="login-password"
              required
              autocomplete="current-password"
            />
          </div>
          <button class="btn login-btn" type="submit" id="submit-btn">
            Sign In
          </button>
          <div class="error-message" id="error-message"></div>
        </form>
      </section>
    </main>

    <div class="toast" id="toast-message"></div>

    <script type="module" src="static/js/app.js"></script>
    <script type="module">
      import { createLiquidGlass } from 'https://esm.sh/solid-glass@0.0.3/engines/svg-refraction';
      import { initPageEffects } from '/static/js/ui-effects.js';

      initPageEffects(createLiquidGlass);
    </script>
  </body>
</html>
