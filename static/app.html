<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS13 Lounge</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="logo-container">CS</div>
      <nav class="nav-menu">
        <div class="nav-item active" id="nav-chat-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
      </nav>
      <div class="profile-container">
        <div class="avatar-circle" id="user-avatar">-</div>
        <div class="nav-item" id="logout-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </div>
      </div>
    </aside>

    <div class="chat-sidebar" data-liquid-glass>
      <div class="chat-sidebar-header">
        <div class="chat-sidebar-title-row">
          <h2 class="chat-sidebar-title">Chats</h2>
          <button class="btn-icon" id="new-chat-trigger">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>
        <div class="search-bar">
          <input class="search-input" type="text" id="chat-search" placeholder="Search chats...">
        </div>
      </div>
      <div class="chat-list" id="chat-list-container"></div>
    </div>

    <main class="chat-content" data-liquid-glass>
      <div class="welcome-screen" id="welcome-screen">
        <h2 class="welcome-title" id="welcome-user-title">Welcome to CS13 Lounge</h2>
        <p class="welcome-subtitle">Select a classmate or group to start chatting, or browse memories below</p>
        <div class="welcome-quote-card">
          <div class="quote-title">Today's Quote</div>
          <div class="quote-text" id="welcome-quote-display">Loading quote...</div>
        </div>
      </div>

      <div class="chat-content-placeholder hidden" id="chat-main-area">
        <div class="chat-header">
          <div class="chat-header-info">
            <div class="chat-header-avatar" id="active-chat-avatar">-</div>
            <div>
              <div class="chat-header-title" id="active-chat-title">Group Chat</div>
              <div class="chat-header-subtitle" id="active-chat-members">Members</div>
            </div>
          </div>
        </div>

        <div class="message-area" id="message-list"></div>

        <div class="chat-input-area">
          <form class="chat-input-form" id="message-form">
            <div class="chat-input-wrapper">
              <input class="chat-input" type="text" id="message-input" placeholder="Type a message..." required autocomplete="off">
            </div>
            <button class="btn-send" type="submit">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="new-chat-modal">
    <div class="card modal-card" data-liquid-glass>
      <div class="modal-header">
        <h3 class="modal-title">New Chat</h3>
        <button class="close-btn" id="new-chat-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group hidden" id="group-name-field">
          <label class="form-label" for="group-chat-name">Group Name</label>
          <input class="form-input" type="text" id="group-chat-name" placeholder="Enter group name...">
        </div>
        <label class="form-label">Select Classmates</label>
        <div class="student-select-list" id="student-list"></div>
      </div>
      <div class="quote-btn-group">
        <button class="btn btn-secondary" id="new-chat-cancel-btn">Cancel</button>
        <button class="btn" id="create-chat-submit-btn">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="change-password-modal">
    <div class="card modal-card" data-liquid-glass>
      <div class="modal-header">
        <h3 class="modal-title">Change Password</h3>
      </div>
      <div class="modal-body">
        <p class="login-subtitle modal-note">
          For your account security, please update your temporary password before entering the lounge.
        </p>
        <form id="change-password-form">
          <div class="form-group">
            <label class="form-label" for="new-password">New Password</label>
            <input class="form-input" type="password" id="new-password" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input class="form-input" type="password" id="confirm-password" required minlength="6">
          </div>
          <div class="error-message" id="password-error-message"></div>
          <button class="btn login-btn" type="submit">Update Password</button>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast-message"></div>

  <script src="js/app.js"></script>
  <script type="module">
    import { createLiquidGlass } from "https://esm.sh/solid-glass@0.0.3/engines/svg-refraction";
    import { initPageEffects } from "/static/js/ui-effects.js";

    initPageEffects(createLiquidGlass);
  </script>
</body>
</html>
